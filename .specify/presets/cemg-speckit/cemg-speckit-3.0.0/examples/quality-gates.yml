# Referência não instalada. Preencher antes de adotar no repositório.
name: Quality gates reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PROJECT_TEST_COMMAND: ''
      FEATURE_DIR: ''
      STAGE_RECORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require project configuration
        shell: bash
        run: |
          test -n "$PROJECT_TEST_COMMAND"
          test -n "$FEATURE_DIR"
          test -n "$STAGE_RECORD"
          test -f .specify/presets/cemg-speckit/tools/check_gate.py
      - name: Run project tests
        # Substituir por etapas concretas e dependências do projeto.
        shell: bash
        run: bash -e -o pipefail -c "$PROJECT_TEST_COMMAND"
      - name: Verify recorded planning conditions for actual checkout
        shell: bash
        run: |
          REVISION=$(git rev-parse HEAD)
          python .specify/presets/cemg-speckit/tools/check_gate.py --feature "$FEATURE_DIR" --record "$STAGE_RECORD" --stage tasks --revision "$REVISION"
      # A resolução ativa e aprovação humana exigem configuração adicional:
      # instalar specify 1.1.3 e usar --project, habilitar evento pull_request
      # após revisão, e exigir estes checks + aprovação na proteção da branch.
